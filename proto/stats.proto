syntax = "proto3";

package stats;

option go_package = "carstats/proto;proto";

service StatsService {
  rpc SubmitUserStats(SubmitUserStatsRequest) returns (SubmitUserStatsResponse);
  rpc GetGlobalStats(GetGlobalStatsRequest) returns (GetGlobalStatsResponse);
}

message SubmitUserStatsRequest {
  string vehicle_id = 1;
  string brand = 2;
  string model = 3;
  string vehicle_type = 4;
  double manual_avg_consumption_l_per_100km = 5;
  double obd_avg_consumption_l_per_100km = 6;
  double avg_refuel_liters = 7;
  double avg_distance_between_refuels_km = 8;
  int64 manual_records_count = 9;
  int64 telemetry_samples_count = 10;
  string updated_at = 11;
}

message SubmitUserStatsResponse {
  bool success = 1;
  string message = 2;
}

message GetGlobalStatsRequest {
  string brand = 1;
  string model = 2;
  string vehicle_type = 3;
}

message GetGlobalStatsResponse {
  string group_name = 1;
  double manual_avg_consumption_l_per_100km = 2;
  double obd_avg_consumption_l_per_100km = 3;
  double avg_refuel_liters = 4;
  double avg_distance_between_refuels_km = 5;
  int64 vehicles_count = 6;
}
